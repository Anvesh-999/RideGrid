version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: ridegrid-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:alpine
    container_name: ridegrid-redis
    ports:
      - "6379:6379"

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: ridegrid-server
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/ridegrid
      - REDIS_URL=redis://redis:6379
      - JWT_ACCESS_SECRET=your_jwt_access_secret_here
      - JWT_REFRESH_SECRET=your_jwt_refresh_secret_here
      - JWT_ACCESS_EXPIRES_IN=15m
      - JWT_REFRESH_EXPIRES_IN=7d
      - DISPATCH_TIMEOUT_SECONDS=15
      - DISPATCH_RADIUS_KM=2
      - DISPATCH_MAX_RADIUS_KM=10
      - DISPATCH_RADIUS_STEP_KM=2
    depends_on:
      - mongodb
      - redis

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: ridegrid-client
    ports:
      - "5173:80"
    depends_on:
      - server

  simulator:
    build:
      context: ./simulator
      dockerfile: Dockerfile
    container_name: ridegrid-simulator
    environment:
      - API_BASE=http://server:5000/api
      - SOCKET_URL=http://server:5000
    depends_on:
      - server

volumes:
  mongodb_data:
