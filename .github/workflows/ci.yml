name: RideGrid CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
      redis:
        image: redis:alpine
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: server/package-lock.json

    - name: Install dependencies
      run: |
        cd server
        npm ci

    - name: Run backend test suite
      run: |
        cd server
        npm test
      env:
        MONGODB_URI: mongodb://localhost:27017/ridegrid
        REDIS_URL: redis://localhost:6379
        JWT_ACCESS_SECRET: github_ci_secret_access_123_abc
        JWT_REFRESH_SECRET: github_ci_secret_refresh_123_abc

  frontend-build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: client/package-lock.json

    - name: Install dependencies
      run: |
        cd client
        npm ci

    - name: Run frontend linter
      run: |
        cd client
        npm run lint

    - name: Build production bundle
      run: |
        cd client
        npm run build
